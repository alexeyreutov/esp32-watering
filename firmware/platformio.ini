; PlatformIO — база автополива на ESP32-C3 с OLED 0.42" (72x40).

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
; 4 MB: two OTA app slots of 1.625 MB + 640 KB "spiffs" used as LittleFS
; (see partitions.csv for why not default.csv).
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Web UI is compiled into the firmware: no separate uploadfs step to forget,
; and OTA always ships the matching UI.
board_build.embed_txtfiles = web/index.html
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -I${PROJECT_DIR}/src
; Panel shifted by a few pixels / garbage on screen -> it is an SH1106 clone:
;  -DWAT_OLED_SH1106=1
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
  olikraus/U8g2 @ ^2.35.30
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Host-side unit tests for src/core (no Arduino): pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<core/>
build_flags = -std=c++17 -I${PROJECT_DIR}/src
