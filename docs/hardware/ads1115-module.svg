><path d="M320 720 L510 720 L510 640 L630 640" fill="none" stroke="#8455b5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M920 400 L1210 400" fill="none" stroke="#f6f7f1" stroke-width="9" stroke-linejoin="round"/><path d="M920 400 L1210 400" fill="none" stroke="#16816a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M920 560 L1010 560 L1010 1090" fill="none" stroke="#f6f7f1" stroke-width="9" stroke-linejoin="round"/><path d="M920 560 L1010 560 L1010 1090" fill="none" stroke="#586775" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M920 640 L1010 640" fill="none" stroke="#f6f7f1" stroke-width="9" stroke-linejoin="round"/><path d="M920 640 L1010 640" fill="none" stroke="#586775" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M920 840 L1050 840 L1050 930 L1210 930" fill="none" stroke="#f6f7f1" stroke-width="9" stroke-linejoin="round"/><path d="M920 840 L1050 840 L1050 930 L1210 930" fill="none" stroke="#16816a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="50" y="300" width="270" height="520" rx="18" fill="#164337" stroke="#2d6553" stroke-width="2"/><rect x="64" y="315" width="242" height="48" rx="8" fill="#0c2e25"/><text x="185" y="346" fill="#fff4d9" text-anchor="middle" font-size="20" font-weight="700">КАБЕЛЬ ОТ БАЗЫ</text><text x="185" y="802" fill="#b5d2c3" text-anchor="middle" font-size="14">IN / OUT: линии идут насквозь</text><circle cx="320" cy="400" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="320" cy="400" r="2.5" fill="#123b31"/><text x="305" y="406" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="end">5V</text><circle cx="320" cy="480" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="320" cy="480" r="2.5" fill="#123b31"/><text x="305" y="486" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="end">GND</text><circle cx="320" cy="560" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="320" cy="560" r="2.5" fill="#123b31"/><text x="305" y="566" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="end">3V3</text><circle cx="320" cy="640" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="320" cy="640" r="2.5" fill="#123b31"/><text x="305" y="646" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="end">SDA</text><circle cx="320" cy="720" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="320" cy="720" r="2.5" fill="#123b31"/><text x="305" y="726" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="end">SCL</text><rect x="630" y="300" width="290" height="700" rx="18" fill="#164337" stroke="#2d6553" stroke-width="2"/><rect x="644" y="315" width="262" height="48" rx="8" fill="#0c2e25"/><text x="775" y="346" fill="#fff4d9" text-anchor="middle" font-size="20" font-weight="700">ADS1115</text><text x="775" y="982" fill="#b5d2c3" text-anchor="middle" font-size="14">адрес №1 = 0x48</text><circle cx="630" cy="400" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="630" cy="400" r="2.5" fill="#123b31"/><text x="645" y="406" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="start">VDD</text><circle cx="630" cy="480" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="630" cy="480" r="2.5" fill="#123b31"/><text x="645" y="486" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="start">GND</text><circle cx="630" cy="560" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="630" cy="560" r="2.5" fill="#123b31"/><text x="645" y="566" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="start">SDA</text><circle cx="630" cy="640" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="630" cy="640" r="2.5" fill="#123b31"/><text x="645" y="646" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="start">SCL</text><circle cx="630" cy="720" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="630" cy="720" r="2.5" fill="#123b31"/><text x="645" y="726" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="start">ADDR</text><circle cx="920" cy="400" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="920" cy="400" r="2.5" fill="#123b31"/><text x="905" y="406" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="end">A0</text><circle cx="920" cy="480" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="920" cy="480" r="2.5" fill="#123b31"/><text x="905" y="486" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="end">A1</text><circle cx="920" cy="560" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="920" cy="560" r="2.5" fill="#123b31"/><text x="905" y="566" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="end">A2</text><circle cx="920" cy="640" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="920" cy="640" r="2.5" fill="#123b31"/><text x="905" y="646" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="end">A3</text><circle cx="920" cy="840" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="920" cy="840" r="2.5" fill="#123b31"/><text x="905" y="846" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="end">ALRT</text><rect x="1210" y="300" width="320" height="270" rx="18" fill="#164337" stroke="#2d6553" stroke-width="2"/><rect x="1224" y="315" width="292" height="48" rx="8" fill="#0c2e25"/><text x="1370" y="346" fill="#fff4d9" text-anchor="middle" font-size="20" font-weight="700">ДАТЧИК ВЛАЖНОСТИ</text><text x="1370" y="552" fill="#b5d2c3" text-anchor="middle" font-size="14">v1.2 · аналоговый AOUT</text><circle cx="1275" cy="300" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="1275" cy="300" r="2.5" fill="#123b31"/><text x="1275" y="388" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="middle">VCC</text><circle cx="1440" cy="300" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="1440" cy="300" r="2.5" fill="#123b31"/><text x="1440" y="388" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="middle">GND</text><circle cx="1210" cy="400" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="1210" cy="400" r="2.5" fill="#123b31"/><text x="1225" y="406" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="start">AOUT</text><rect x="1210" y="750" width="320" height="290" rx="18" fill="#164337" stroke="#2d6553" stroke-width="2"/><rect x="1224" y="765" width="292" height="48" rx="8" fill="#0c2e25"/><text x="1370" y="796" fill="#fff4d9" text-anchor="middle" font-size="20" font-weight="700">HW-532 · КЛАПАН</text><text x="1370" y="1022" fill="#b5d2c3" text-anchor="middle" font-size="14">оптрон; вход изолирован</text><circle cx="1275" cy="750" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="1275" cy="750" r="2.5" fill="#123b31"/><text x="1275" y="838" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="middle">+</text><circle cx="1440" cy="750" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="1440" cy="750" r="2.5" fill="#123b31"/><text x="1440" y="838" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="middle">−</text><circle cx="1210" cy="840" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="1210" cy="840" r="2.5" fill="#123b31"/><text x="1225" y="846" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="start">PWM</text><circle cx="1210" cy="930" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="1210" cy="930" r="2.5" fill="#123b31"/><text x="1225" y="936" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="start">GND сигн.</text><circle cx="1530" cy="930" r="8" fill="#dbbc71" stroke="#fff0c7" stroke-width="2"/><circle cx="1530" cy="930" r="2.5" fill="#123b31"/><text x="1515" y="936" fill="#fff3d4" font-family="Consolas,monospace" font-size="17" text-anchor="end">LOAD</text><text x="45" y="50" font-size="32" fill="#243e33" text-anchor="start">ADS1115 · один модуль целиком</text><text x="45" y="88" font-size="20" fill="#243e33" text-anchor="start">Контакты показаны по именам. Расположение на вашей плате может отличаться.</text><text x="1495" y="145" font-size="17" fill="#c74739" text-anchor="end">5V линии</text><text x="1495" y="195" font-size="17" fill="#ad740c" text-anchor="end">3V3 линии</text><text x="1495" y="1120" font-size="17" fill="#586775" text-anchor="end">GND · общий минус</text><circle cx="1170" cy="160" r="6" fill="#c74739"/><circle cx="520" cy="210" r="6" fill="#ad740c"/><circle cx="1275" cy="210" r="6" fill="#ad740c"/><circle cx="1100" cy="210" r="6" fill="#ad740c"/><circle cx="560" cy="1090" r="6" fill="#586775"/><circle cx="560" cy="720" r="6" fill="#586775"/><circle cx="1540" cy="1090" r="6" fill="#586775"/><circle cx="1570" cy="750" r="6" fill="#586775"/><circle cx="1010" cy="640" r="6" fill="#586775"/><circle cx="1010" cy="1090" r="6" fill="#586775"/><text x="947" y="485" font-size="17" fill="#243e33" text-anchor="start">NC · не подключать</text><text x="947" y="517" font-size="15" fill="#243e33" text-anchor="start">lineSense выключен</text><text x="990" y="380" font-size="17" fill="#16816a" text-anchor="start">AOUT → A0</text><text x="940" y="900" font-size="16" fill="#16816a" text-anchor="start">ALRT → GND сигнала</text><text x="45" y="900" font-size="20" fill="#243e33" text-anchor="start">ADDR: выберите ОДИН контакт</text><text x="45" y="936" font-size="18" fill="#243e33" text-anchor="start">№1 → GND   (как нарисовано)</text><text x="45" y="970" font-size="18" fill="#243e33" text-anchor="start">№2 → VDD / 3V3</text><text x="45" y="1004" font-size="18" fill="#243e33" text-anchor="start">№3 → SDA    №4 → SCL</text><text x="45" y="1038" font-size="17" fill="#243e33" text-anchor="start">Два одинаковых адреса нельзя.</text><text x="45" y="1170" font-size="22" fill="#243e33" text-anchor="start">ВАЖНО: сигнальный GND ключа идёт к ALRT, НЕ к общему GND.</text><text x="45" y="1205" font-size="18" fill="#243e33" text-anchor="start">Если GND сигнала звонится с силовым −, нужна схема 07Б с BC557. LOAD → минус клапана; плюс → 5V.</text><text x="45" y="1238" font-size="18" fill="#243e33" text-anchor="start">Диод параллельно клапану, полоской к плюсу. Не добавляйте подтяжки SDA/SCL или ALRT к 5 В.</text></svg>
